# Render Blueprint for the proof-of-concept host (D-064, D-065).
# New > Blueprint > this repository, branch `main` (`poc` is kept equal to
# `main` so an older Blueprint linked to it deploys the same code). Render creates the API,
# its PostgreSQL database and its Redis-compatible Key Value store in one
# region and wires the connection strings itself, so none is typed by hand.
#
# NOT production: messages are discarded (sign-up and reset codes never
# arrive), uploads sit unencrypted on the instance's disk and are lost on
# every deploy, and the free database expires. Use demo data only.

databases:
  - name: flyviman-db
    plan: free
    region: singapore
    databaseName: flyviman
    user: flyviman
    # No connections from outside Render: only services in this account,
    # over the private network (security review, 2026-11-13).
    ipAllowList: []

services:
  - type: keyvalue
    name: flyviman-redis
    plan: free
    region: singapore
    # One-time codes, sessions' reset tokens, idempotency keys and rate-limit
    # counters must not be evicted to make room. A full Redis refuses writes;
    # rate limiting then falls back to per-process counting.
    maxmemoryPolicy: noeviction
    # No public access: only services in this account, over the private network.
    ipAllowList: []

  - type: web
    name: flyviman-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    # Dev dependencies are needed to compile (NODE_ENV=production skips them).
    buildCommand: npm ci --include=dev && npm run build
    # Migrate, seed (safe to repeat), then start. The API refuses to start
    # if PostgreSQL or Redis cannot be reached.
    # db:grant re-applies the restricted role's privileges (idempotent), for
    # when the role was created after its migration ran. A failure only warns:
    # the API then runs as the owner, as before, and says so at start.
    startCommand: npx prisma migrate deploy && (npm run db:grant || echo "WARNING db:grant failed; the restricted role has no privileges yet (docs/deployment.md)") && node dist/seed.js && node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: MESSAGING_PROVIDER
        value: sink
      - key: STORAGE_PROVIDER
        value: local
      # The web app's address on Vercel, exactly as the browser shows it (no
      # trailing slash). The browser reaches this API through that site's
      # /api/v1 proxy, so this is the only origin allowed. Change it here if
      # the Vercel project has another name or a custom domain.
      - key: WEB_ORIGIN
        value: https://flyviman-web.vercel.app
      # Every browser request arrives from the web host's addresses, so the
      # per-address limits are raised for the proof of concept.
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_DEFAULT_PER_MINUTE
        value: "600"
      # Enquiries from every visitor share the web host's address here, so
      # the contact form's limit is raised too: a shared counter
      # (deployment.md). Lower it to 5 once WEB_PROXY_SECRET (below) is set
      # on both hosts, so the web host passes each visitor's address on.
      - key: RATE_LIMIT_ENQUIRY_PER_WINDOW
        value: "60"
      # Searches and fare calendars from every visitor share that address
      # too: the search tier (20 a minute) is raised the same way (D-099).
      - key: RATE_LIMIT_SEARCH_PER_MINUTE
        value: "300"
      # Migrations, db:grant and the seed connect as the database's owner.
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: flyviman-db
          property: connectionString
      # The API's own connection. Until the restricted role flyviman_app has
      # a login (docs/deployment.md), it is the owner too and the API warns at
      # start. Then replace these three lines with `sync: false` and set the
      # internal URL with flyviman_app and its password in the dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: flyviman-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flyviman-redis
          property: connectionString
      - key: SEED_ADMIN_EMAIL
        value: admin@flyviman.test
      - key: SEED_DEMO_ACCOUNTS
        value: "true"
      # Entered once in the dashboard when the Blueprint is created; never
      # committed. API_PUBLIC_URL is not needed: Render's own
      # RENDER_EXTERNAL_URL is used.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_LOCAL_PASSWORD
        sync: false
      # The payment gateway's key and webhook secrets (W3-4). Required in
      # production (at least 16 characters, never the development values).
      # Only the mock gateway exists, which moves no money, so Render
      # generates both; set them by hand when a real gateway is configured.
      - key: PAYMENT_KEY_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      # Required (production without COOKIE_DOMAIN): the same value as
      # WEB_PROXY_SECRET on the web host (openssl rand -base64 48), which signs
      # each visitor's address so rate limits and the sign-in lockout count
      # visitors apart. Without it the API refuses to start. Render prompts
      # for it only when a Blueprint is first created; on an existing one, add
      # it by hand under the service's Environment, and on Vercel too.
      - key: WEB_PROXY_SECRET
        sync: false
