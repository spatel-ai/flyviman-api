# Local development services. Credentials are for local use only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: flyviman
      POSTGRES_PASSWORD: flyviman
      POSTGRES_DB: flyviman
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flyviman -d flyviman']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
